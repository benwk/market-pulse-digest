name: Market Pulse

on:
  schedule:
    - cron: "0 7 * * 1" # 08:00 in London during British Summer Time
    - cron: "0 8 * * 1" # 08:00 in London the rest of the year
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the email (untick to preview the digest in the run summary only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  digest:
    # The template itself never runs on a schedule; copies of it do.
    if: github.event_name == 'workflow_dispatch' || github.repository != 'benwk/market-pulse-digest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write and send the digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SCHEDULE: ${{ github.event.schedule }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: python scripts/market_pulse.py

      - name: Keep a copy of the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-pulse
          path: out/
          if-no-files-found: ignore
